<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Код для входа</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f7f3ef;color:#292330;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:32px;background:#fffdfa;border:1px solid #e2d9d4;border-radius:12px">
    <p style="margin:0 0 24px;color:#854754;font-weight:700;letter-spacing:.08em">{{ if .Data.auth_app_name }}{{ .Data.auth_app_name }}{{ else }}Admin{{ end }}</p>
    <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3">Код для входа</h1>
    <p style="margin:0 0 8px;line-height:1.6">Введите этот код на странице входа:</p>
    <p style="margin:0 0 22px;padding:14px 18px;background:#f7f3ef;border-radius:8px;font-size:30px;font-weight:700;letter-spacing:.22em;text-align:center">{{ .Token }}</p>
    <p style="margin:0 0 18px;line-height:1.6">Или войдите по кнопке:</p>
    <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;background:#854754;color:#fff;text-decoration:none;border-radius:6px;font-weight:700">Войти</a></p>
    <p style="margin:0;color:#746875;font-size:13px;line-height:1.6">Если вы не запрашивали вход, просто проигнорируйте письмо. Не сообщайте код другим людям.</p>
  </div>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверяем оплату — Я БЫЛ ЗДЕСЬ</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div class="wrap">
<div class="top"><a class="logo" href="./index.html">Я БЫЛ ЗДЕСЬ</a></div>
<div class="box">
<h1>Проверяем оплату</h1>
<div id="status" class="notice">Подождите несколько секунд…</div>
<div id="actions" class="actions"></div>
</div></div>
<script src="./config.js"></script><script src="./api-payments.js"></script>
<script>
(async function(){
  const no=Number(new URLSearchParams(location.search).get("no")||0);
  const ownerKey=YBZ.getOwnerKey();
  const status=document.getElementById("status");
  const actions=document.getElementById("actions");

  for(let i=0;i<15;i++){
    try{
      const rows=await YBZ.rpc("ybz_get_my_entries",{p_owner_key:ownerKey}) || [];
      const entry=rows.find(x=>Number(x.public_no)===no);
      if(entry && entry.status==="published" && entry.payment_status==="paid"){
        status.innerHTML="<b>Оплата подтверждена.</b> Запись опубликована.";
        setTimeout(()=>location.href=`./my.html?paid=${encodeURIComponent(no)}`,900);
        return;
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,2000));
  }

  status.className="notice";
  status.innerHTML="Платёж ещё обрабатывается или не был завершён. Если вы оплатили, подождите немного и проверьте снова.";
  actions.innerHTML=`<a class="btn2" href="./my.html">Перейти в «Мои записи»</a>`;
})();
</script>
</body></html>

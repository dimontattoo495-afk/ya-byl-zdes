<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запись — Я БЫЛ ЗДЕСЬ</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div class="wrap">
<div class="top"><a class="logo" href="./index.html">Я БЫЛ ЗДЕСЬ</a><div class="nav"><a href="./create.html">Оставить свой след</a></div></div>
<div class="box">
<div id="status" class="loading">Загрузка…</div>
<div id="entry"></div>
</div></div>
<script src="./config.js"></script><script src="./api.js"></script>
<script>
(async function(){
  const no=Number(new URLSearchParams(location.search).get("no")||0);
  const status=document.getElementById("status");
  try{
    const rows=await YBZ.rpc("ybz_get_entry",{p_public_no:no});
    const e=Array.isArray(rows)?rows[0]:rows;
    if(!e) throw new Error("Запись не найдена или скрыта.");
    document.title=`Запись №${e.public_no} — Я БЫЛ ЗДЕСЬ`;
    document.getElementById("entry").innerHTML=`
      <article class="card ${YBZ.esc(e.plan)}">
        <div class="num">ЗАПИСЬ №${YBZ.fmt(e.public_no)}</div>
        <div class="msg" style="font-size:24px">${YBZ.esc(e.message)}</div>
        <div class="meta">${YBZ.esc(e.name || "Без имени")}${e.city ? " · "+YBZ.esc(e.city):""}${e.is_demo ? " · пример" : ""} · просмотры: ${YBZ.fmt(e.views)}</div>
      </article>
      <p><a class="cta" href="./create.html">ОСТАВИТЬ СВОЮ ЗАПИСЬ</a></p>`;
    status.style.display="none";
  }catch(err){
    status.className="notice error"; status.textContent=err.message;
  }
})();
</script>
</body></html>

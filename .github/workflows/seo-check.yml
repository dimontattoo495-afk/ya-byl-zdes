name: SEO and safe domain migration checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'zags/**'
      - '.github/workflows/seo-check.yml'
  schedule:
    - cron: '23 5 * * *' # daily, around 08:23 Moscow time
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate sitemap, metadata and payment safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base='https://yabylzdes.ru/'
          public=['index.html','create.html','about.html','payment.html','offer.html','privacy.html','contacts.html']
          for page in public:
              s=Path(page).read_text(encoding='utf-8')
              canonical=base if page=='index.html' else base+page
              assert f'rel="canonical" href="{canonical}"' in s, f'{page}: wrong canonical'
              assert 'name="description"' in s, f'{page}: no description'
          for page in ['my.html','admin.html','payment-return.html','zags/index.html']:
              s=Path(page).read_text(encoding='utf-8')
              assert 'name="robots" content="noindex,nofollow,noarchive"' in s, f'{page}: should be noindex'
          assert 'paymentsEnabled:false' in Path('zags/index.html').read_text(encoding='utf-8')
          tree=ET.parse('sitemap.xml')
          locs=[(node.text or '').strip() for node in tree.findall('.//{*}loc')]
          expected={base if f=='index.html' else base+f for f in public}
          assert set(locs)==expected, f'sitemap mismatch: {set(locs)^expected}'
          assert 'Sitemap: '+base+'sitemap.xml' in Path('robots.txt').read_text(encoding='utf-8')
          assert Path('CNAME').read_text(encoding='utf-8').strip()=='yabylzdes.ru', 'GitHub Pages custom domain does not match sitemap'
          print('PASS: public metadata, robots, sitemap, protected pages and safe payment staging')
          PY
      - name: Read-only public site smoke check
        run: |
          node - <<'JS'
          const base='https://yabylzdes.ru/';
          async function get(path,needle){
            let last='';
            for(let i=0;i<5;i++){
              try{
                const r=await fetch(base+path,{signal:AbortSignal.timeout(12000),redirect:'follow'});
                last='HTTP '+r.status;
                const html=await r.text();
                if(r.ok&&html.includes(needle)){
                  console.log('PASS '+path+' HTTP '+r.status);return;
                }
                last+= ' / missing expected content';
              }catch(e){last=e.message;}
              if(i<4) await new Promise(ok=>setTimeout(ok,8000));
            }
            throw Error(path+': '+last);
          }
          (async()=>{
            await get('','id="zags-title"');
            await get('sitemap.xml','<urlset');
            await get('robots.txt','Sitemap:');
            await get('zags/','paymentsEnabled:false');
            console.log('PASS: public main site, sitemap, robots and ZAGS');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS

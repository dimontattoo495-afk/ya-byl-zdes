name: ZAGS vintage browser QA
on:
  pull_request:
    paths:
      - 'zags/**'
      - '.github/workflows/zags-vintage-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test certificate visually and functionally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zags-http.log 2>&1 &
          node zags/browser-vintage.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zags-vintage-screenshot
          path: /tmp/zags-vintage-certificate.png
          retention-days: 7

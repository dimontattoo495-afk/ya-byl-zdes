name: ZAGS launch information, offer, consent and email
on:
  pull_request:
    paths:
      - 'zags/index.html'
      - 'zags/how-it-works.html'
      - 'zags/privacy.html'
      - 'zags/offer.html'
      - 'zags/service-rules-check.cjs'
      - 'zags/auth-email-check.cjs'
      - 'zags/email-templates/**'
      - 'zags/beget/009_AUTH_EMAIL_FIX_RU.md'
      - '.github/workflows/zags-service-rules.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node zags/service-rules-check.cjs
      - run: node zags/auth-email-check.cjs

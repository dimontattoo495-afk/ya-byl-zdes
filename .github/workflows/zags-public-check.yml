name: Verify published ZAGS
on:
  push:
    branches: [main]
    paths:
      - 'zags/**'
      - 'index.html'
      - '.github/workflows/zags-public-check.yml'
  workflow_dispatch:
jobs:
  published-zags:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify source safety
        run: |
          test -f zags/index.html
          grep -q 'paymentsEnabled:false' zags/index.html
          grep -q 'ТЕСТОВАЯ ВЕРСИЯ' zags/index.html
          grep -q 'noindex,nofollow,noarchive' zags/index.html
      - name: Check GitHub Pages HTTPS
        shell: bash
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://dimontattoo495-afk.github.io/ya-byl-zdes/zags/';
            for(let i=0;i<4;i++){
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(12000)});
              console.log('GitHub Pages response HTTP '+r.status);
              if(r.ok){
                const html=await r.text();
                if(!html.includes('paymentsEnabled:false')||!html.includes('ТЕСТОВАЯ ВЕРСИЯ'))throw Error('Wrong page or payments unsafe');
                const home=await fetch('https://dimontattoo495-afk.github.io/ya-byl-zdes/',{signal:AbortSignal.timeout(12000)});
                if(!home.ok)throw Error('Main site homepage HTTP '+home.status);
                const front=await home.text();
                if(!front.includes('href="./zags/"')||!front.includes('id="zags-title"'))throw Error('Main site missing new ZAGS navigation');
                const policy=await fetch('https://dimontattoo495-afk.github.io/ya-byl-zdes/zags/privacy.html',{signal:AbortSignal.timeout(12000)});
                if(!policy.ok)throw Error('ZAGS-specific privacy page HTTP '+policy.status);
                const policyHtml=await policy.text();
                if(!policyHtml.includes('Данные в тестовом'))throw Error('Incorrect ZAGS privacy notice');
                console.log('PASS: live homepage link, virtual ZAGS HTTPS and privacy notice, payments disabled');
                return;
              }
              if(i<3)await new Promise(resolve=>setTimeout(resolve,12000));
            }
            throw Error('Published GitHub Pages site not reachable');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS

name: Verify published ZAGS launch
on:
  push:
    branches: [main]
    paths:
      - 'zags/**'
      - 'index.html'
      - '.github/workflows/zags-public-check.yml'
  workflow_dispatch:
jobs:
  published-zags:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source launch readiness
        run: |
          test -f zags/index.html
          test -f zags/offer.html
          grep -q 'paymentsEnabled:true' zags/index.html
          grep -q 'НЕ ГОСУДАРСТВЕННЫЙ ЗАГС' zags/index.html
          node zags/service-rules-check.cjs
      - name: Check published ZAGS pages
        shell: bash
        run: |
          node - <<'JS'
          (async()=> {
            const base='https://yabylzdes.ru/zags/';
            const paths=['','offer.html','how-it-works.html','privacy.html'];
            for(let i=0;i<4;i++){
              const pages=await Promise.all(paths.map(async p=>{
                const r=await fetch(base+p,{redirect:'follow',signal:AbortSignal.timeout(12000)});
                if(!r.ok)throw Error(p+' HTTP '+r.status);
                return [p,await r.text()];
              }));
              const m=Object.fromEntries(pages);
              if(m[''].includes('ТЕСТОВАЯ ВЕРСИЯ')||!m[''].includes('paymentsEnabled:true'))throw Error('Published ZAGS is still in test mode');
              if(!m['offer.html'].includes('149 ₽')||!m['offer.html'].includes('ОГРНИП 320508100007401'))throw Error('Public ZAGS offer is missing required details');
              if(!m['privacy.html'].includes('Beget в России')||!m['privacy.html'].includes('Т‑Банк'))throw Error('Public privacy policy is incomplete');
              console.log('PASS: live ZAGS checkout and public terms, privacy and how-it-works pages');
              return;
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS

name: ZAGS production payment pre-release safety
on:
  pull_request:
    paths:
      - 'zags/production-payment/**'
      - 'zags/production-payment-check.cjs'
      - 'zags/production-payment-contract-check.mjs'
      - '.github/workflows/zags-production-payment-gate.yml'
      - 'zags/index.html'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node zags/production-payment-check.cjs
      - run: node zags/production-payment-contract-check.mjs

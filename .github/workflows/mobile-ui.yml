name: Mobile responsive Chromium checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'create.html'
      - 'zags/index.html'
      - 'tests/mobile-layout.cjs'
      - 'admin.html'
      - 'admin.js'
      - 'payment-return.html'
      - 'tests/admin-ten-rub.cjs'
      - '.github/workflows/mobile-ui.yml'
  workflow_dispatch:
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check mobile/desktop layout without creating records
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ybz-http.log 2>&1 &
          sleep 2
          timeout 135s node tests/mobile-layout.cjs
          timeout 35s node tests/admin-ten-rub.cjs
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ybz-mobile-layout-evidence
          path: |
            /tmp/ybz-mobile-home.png
            /tmp/ybz-mobile-create.png
            /tmp/ybz-mobile-zags.png
          retention-days: 7
          if-no-files-found: ignore

name: ZAGS staging checks
on:
  pull_request:
    paths:
      - 'zags/**'
      - 'config.js'
      - '.github/workflows/zags-check.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged ZAGS files
        run: node zags/preflight.cjs
      - name: Validate app JavaScript syntax
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync("zags/index.html","utf8");const a=s.indexOf("<script type=\"module\">");const b=s.lastIndexOf("</script>");if(a<0||b<a)process.exit(1);fs.writeFileSync("/tmp/zags-module.mjs",s.slice(a+22,b))'
          node --check /tmp/zags-module.mjs
      - name: Package preview files
        run: zip -r zags-staging-preview.zip zags/index.html zags/README.md config.js
      - name: Upload staging preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: zags-staging-preview
          path: zags-staging-preview.zip
          retention-days: 7

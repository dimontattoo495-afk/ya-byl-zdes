name: ZAGS staging checks
on:
  pull_request:
    paths:
      - 'zags/**'
      - 'config.js'
      - '.github/workflows/zags-check.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged ZAGS files
        run: node zags/preflight.cjs

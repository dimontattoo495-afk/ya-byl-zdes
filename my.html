<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои записи — Я БЫЛ ЗДЕСЬ</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div class="wrap">
<div class="top"><a class="logo" href="./index.html">Я БЫЛ ЗДЕСЬ</a><div class="nav"><a href="./create.html">Новая запись</a></div></div>
<div class="box">
<h1>Мои записи</h1>
<div id="newNotice"></div>
<p class="small">Доступ к этим записям защищён секретным ключом. Сохраните ссылку этой страницы и никому её не отправляйте.</p>
<label>Секретная ссылка управления</label>
<input id="secretLink" readonly onclick="this.select()">
<div class="actions">
<button id="copyLink">Скопировать ссылку</button>
</div>
<div id="status" class="loading">Загрузка…</div>
<div id="list"></div>
</div></div>

<script src="./config.js"></script><script src="./api.js"></script>
<script>
const ownerKey=YBZ.getOwnerKey();
const secretUrl=new URL("./my.html",location.href);
secretUrl.searchParams.set("key",ownerKey);
document.getElementById("secretLink").value=secretUrl.href;
document.getElementById("copyLink").onclick=async()=>{
  await navigator.clipboard.writeText(secretUrl.href);
  document.getElementById("copyLink").textContent="Скопировано";
  setTimeout(()=>document.getElementById("copyLink").textContent="Скопировать ссылку",1400);
};
const qs=new URLSearchParams(location.search);
if(qs.get("new")){
  document.getElementById("newNotice").innerHTML=`<div class="notice"><b>Готово.</b> Запись №${YBZ.esc(qs.get("new"))} создана. Сохраните секретную ссылку.</div>`;
}

async function load(){
  const status=document.getElementById("status");
  const list=document.getElementById("list");
  try{
    const rows=await YBZ.rpc("ybz_get_my_entries",{p_owner_key:ownerKey});
    if(!rows || !rows.length){
      list.innerHTML=`<div class="notice">У этого секретного ключа пока нет записей.</div>`;
    }else{
      list.innerHTML=rows.map(e=>`
        <article class="card ${YBZ.esc(e.plan)}" style="margin-top:14px">
          <div class="num">ЗАПИСЬ №${YBZ.fmt(e.public_no)}</div>
          <div class="msg" id="msg-${e.public_no}">${YBZ.esc(e.message)}</div>
          <div class="meta">Статус: ${YBZ.esc(e.status)} · просмотры: ${YBZ.fmt(e.views)} · ${YBZ.esc(e.price_rub)} ₽ (демо)</div>
          <div class="actions">
            <a href="./entry.html?no=${encodeURIComponent(e.public_no)}">Открыть</a>
            <button onclick="editEntry(${e.public_no}, ${JSON.stringify(e.message).replace(/</g,'\\u003c')})">Изменить</button>
            <button onclick="toggleEntry(${e.public_no})">${e.status==="hidden"?"Опубликовать":"Скрыть"}</button>
          </div>
        </article>`).join("");
    }
    status.style.display="none";
  }catch(err){
    status.className="notice error"; status.textContent=err.message;
  }
}
window.editEntry=async function(no,current){
  const next=prompt("Новый текст записи:",current);
  if(next===null)return;
  try{
    await YBZ.rpc("ybz_update_my_entry",{p_owner_key:ownerKey,p_public_no:no,p_message:next});
    await load();
  }catch(err){alert(err.message)}
};
window.toggleEntry=async function(no){
  try{
    await YBZ.rpc("ybz_toggle_my_entry",{p_owner_key:ownerKey,p_public_no:no});
    await load();
  }catch(err){alert(err.message)}
};
load();
</script>
</body></html>
